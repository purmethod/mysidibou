name: Refresh Sidi Bou and Tunis events
on:
  schedule:
    # Africa/Tunis is UTC+1: 22:59 UTC = 23:59 Tunisia time.
    - cron: '59 22 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/*.py'
      - 'tests/test*.py'
      - 'data/sources.json'
      - '.github/workflows/refresh-events.yml'
permissions:
  contents: write
concurrency:
  group: event-collector
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify date and source handling
        run: python3 -m unittest discover -s tests -p "test_events.py"
      - name: Collect upcoming events
        run: python3 scripts/collect_events.py
      - name: Save updated event data
        run: |
          git config user.name "mysidibou Events"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/kompas/events.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh upcoming Sidi Bou and Tunis events"
            git push origin HEAD:main
          fi

